<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">

    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        html{ scroll-behavior:smooth; }
        body{
            font-family:'Cormorant Garamond', serif;
            background: #0a1628;
            color: #e8e8e8;
        }
        .hero{
            width:100%;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:20px;
            text-align:center;
        }
        <!-- HERO -->
<section class="hero" id="home">
    <img src="liena-logo.png" alt="LIENA Logo" onerror="this.style.display='none';">
    <h1>FROM FORGOTTEN TO LEGENDARY</h1>
    <p>We transform forgotten properties burdened with tax liens into legendary opportunities.</p>
    
    <div class="buttons">
        <a href="#legend" class="btn">THE LEGEND</a>
        <a href="#what-is-lien" class="btn">WHAT IS A LIEN?</a>
        <a href="#what-is-liena" class="btn">WHAT IS LIENA?</a>
        <a href="#lna" class="btn">LNA TOKEN</a>
        <a href="#roadmap" class="btn">ROADMAP</a>
        <a href="#community" class="btn">COMMUNITY</a>
        <a href="https://x.com" target="_blank" class="btn btn-x">𝕏</a>
    </div>
</section>
        }
        .hero h1{
            font-family:'Cinzel', serif;
            font-size:78px;
            color:#D4AF37;
            margin-bottom:16px;
            letter-spacing:5px;
        }
        .hero p{
            font-size:26px;
            max-width:780px;
            color:#c8d4e8;
            line-height:1.4;
        }
        .buttons{
            position:fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%);
            z-index:999;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:9px;
            background:rgba(7,20,38,0.95);
            padding:10px 16px;
            border-radius:50px;
            backdrop-filter:blur(12px);
            border:1px solid rgba(77,166,255,0.3);
        }
        .btn{
            color:#4da6ff;
            padding:10px 17px;
            text-decoration:none;
            border:1px solid #4da6ff;
            border-radius:50px;
            font-weight:600;
            transition:all .3s ease;
            font-size:13.8px;
            white-space:nowrap;
        }
        .btn:hover{
            background:#4da6ff;
            color:white;
            transform:translateY(-3px);
        }
        .btn-x {
            background:#000;
            color:white;
            border-color:#666;
        }
        .btn-x:hover {
            background:#fff;
            color:#000;
        }
        .section{ padding:120px 20px; }
        .card{
            background:#0d2038;
            max-width:1000px;
            margin:auto;
            padding:60px 45px;
            border-radius:22px;
            border:1px solid rgba(77,166,255,.25);
        }
        h2{
            text-align:center;
            color:#D4AF37;
            font-size:54px;
            margin-bottom:45px;
            font-family:'Cinzel', serif;
        }
        p{ line-height:1.85; font-size:23px; }
        footer{
            margin-top:100px;
            background:#081b33;
            text-align:center;
            padding:40px;
            color:#9cb4d8;
        }
    </style>
</head>
<body>

<!-- HERO -->

    <h1>FROM FORGOTTEN TO LEGENDARY</h1>

    <div class="buttons">
