<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIENA | From Forgotten To Legendary</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        html{ scroll-behavior:smooth; }
        body{
            font-family:'Cormorant Garamond', serif;
            background: #0a1628;
            color: #e8e8e8;
        }
        .hero{
            width:100%;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:20px;
            text-align:center;
        }
        .hero img{
            width:95%;
            max-width:1100px;
            border-radius:20px;
            box-shadow: 0 0 40px rgba(77,166,255,.6), 0 0 100px rgba(212,175,55,.3);
            margin-bottom:30px;
        }
        .hero h1{
            font-family:'Cinzel', serif;
            font-size:72px;
            color:#D4AF37;
            margin-bottom:15px;
            letter-spacing:3px;
            text-shadow: 0 0 30px rgba(212,175,55,.5);
        }
        .hero p{
            font-size:28px;
            max-width:800px;
            color:#c8d4e8;
            line-height:1.4;
        }
        .buttons{
            position:fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%);
            z-index:999;
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:12px;
            background:rgba(7,20,38,0.85);
            padding:12px 18px;
            border-radius:15px;
            backdrop-filter:blur(10px);
        }
        .btn{
            color:#4da6ff;
            padding:10px 20px;
            text-decoration:none;
            border:1px solid #4da6ff;
            border-radius:8px;
            font-weight:bold;
            transition:all .3s ease;
            font-size:14px;
        }
        .btn:hover{
            background:#4da6ff;
            color:white;
            box-shadow:0 0 20px #4da6ff;
            transform:translateY(-3px);
        }
        /* Estilo especial para el botón X */
        .btn-x {
            background:#000;
            color:white;
            border-color:#fff;
        }
        .btn-x:hover {
            background:#fff;
            color:#000;
        }
        .section{ padding:100px 20px; }
        .card{
            background:#0d2038;
            max-width:1000px;
            margin:auto;
            padding:50px 40px;
            border-radius:20px;
            border:1px solid rgba(77,166,255,.25);
            box-shadow: 0 0 20px rgba(77,166,255,.15), 0 0 60px rgba(77,166,255,.05);
        }
        h2{
            text-align:center;
            color:#D4AF37;
            font-size:52px;
            margin-bottom:40px;
            font-family:'Cinzel', serif;
            letter-spacing:2px;
        }
        p{ line-height:1.85; font-size:24px; }
        footer{
            margin-top:80px;
            background:#081b33;
            text-align:center;
            padding:40px;
            color:#9cb4d8;
        }
        #legend h2{ font-size:64px; margin-bottom:50px; }
        .roadmap-item {
            margin: 25px 0;
            padding-left: 20px;
            border-left: 3px solid #4da6ff;
            position: relative;
        }
        .roadmap-item::before {
            content: "●";
            color: #D4AF37;
            position: absolute;
            left: -10px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<!-- HERO -->
<section class="hero" id="home">
    <img src="liena-logo.png" alt="LIENA Logo">
    <h1>FROM FORGOTTEN TO LEGENDARY</h1>
    <p>Transformamos propiedades olvidadas y gravadas con tax liens en oportunidades legendarias.</p>
    
    <div class="buttons">
        <a href="#legend" class="btn">THE LEGEND</a>
        <a href="#what-is-lien" class="btn">WHAT IS A LIEN?</a>
        <a href="#what-is-liena" class="btn">WHAT IS LIENA?</a>
        <a href="#lna" class="btn">LNA TOKEN</a>
        <a href="#roadmap" class="btn">ROADMAP</a>
        <a href="#community" class="btn">COMMUNITY</a>
        <a href="https://x.com" target="_blank" class="btn btn-x">𝕏</a>
    </div>
</section>

<!-- Resto de secciones (Legend, What is a Lien, etc.) permanecen iguales -->

</body>
</html>
